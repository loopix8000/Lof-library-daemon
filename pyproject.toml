[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lof-library-daemon"
version = "0.1.0"
description = "Lof Writer 개인용 서재 동기화 서버"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "diff-match-patch==20241021",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["lof_daemon*"]
