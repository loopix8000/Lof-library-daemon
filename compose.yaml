services:
  daemon:
    build: .
    image: lof-library-daemon:local
    restart: unless-stopped
    environment:
      LOF_DATA_DIR: /data
      LOF_SERVER_NAME: ${LOF_SERVER_NAME:-}
      # 이전 버전의 공통 토큰을 쓰던 기기가 있을 때만 설정합니다.
      LOF_API_TOKEN: ${LOF_API_TOKEN:-}
    ports:
      - "${LOF_PORT:-8787}:8787"
    volumes:
      - library-data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  library-data:
