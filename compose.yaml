services:
  daemon:
    build: .
    image: lof-library-daemon:local
    restart: unless-stopped
    environment:
      LOF_DATA_DIR: /data
      LOF_SERVER_NAME: ${LOF_SERVER_NAME:-}
    ports:
      - "${LOF_PORT:-8787}:8787"
    volumes:
      - library-data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  library-data:
