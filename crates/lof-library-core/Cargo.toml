[package]
name = "lof-library-core"
description = "Lof Writer Iroh 서재 동기화 피어"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
tracing.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
subtle = "2.6"
lof-realtime = { path = "../lof-realtime" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "portmapper"] }
notify = "8.2"
