[workspace]
resolver = "2"
members = [
    "crates/lof-realtime",
    "crates/lof-library-core",
    "crates/lof-library-server",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
lof-library-core = { path = "crates/lof-library-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
