name: Windows 업데이트 배포

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 빌드 도구 설치
        working-directory: desktop
        run: npm ci
      - name: 업데이트 설정 확인
        id: updater
        working-directory: desktop
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          SIGNING_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          if ($env:SIGNING_KEY_PRESENT -ne 'true') { throw 'TAURI_SIGNING_PRIVATE_KEY secret을 등록해 주세요.' }
          npm run updater:prepare
      - name: 공개된 버전 덮어쓰기 방지
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.updater.outputs.version }}
        shell: pwsh
        run: |
          $releasedTags = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false) | .tag_name'
          if ($LASTEXITCODE -ne 0) { throw '기존 릴리즈를 확인하지 못했습니다.' }
          if ($releasedTags -contains "v$env:RELEASE_VERSION") { throw '이미 공개된 버전입니다. 새 버전으로 배포해 주세요.' }
      - name: 서명된 설치 파일과 업데이트 초안 만들기
        id: release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: Lof Library v__VERSION__
          releaseBody: Windows 설치 파일을 내려받아 설치하세요. 기존 데이터와 연결 설정은 유지됩니다.
          releaseDraft: true
          prerelease: ${{ steps.updater.outputs.prerelease == 'true' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.updater.generated.json -- --locked
      - name: 릴리즈 노트 적용
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.updater.outputs.version }}
        run: gh release edit "v$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
