name: Iroh 피어 컴파일

on: [push, pull_request]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 정적 검사
        run: cargo clippy --locked -p lof-library-core -p lof-library-server --all-targets -- -D warnings
      - name: Docker 이미지 빌드
        run: docker build -t lof-library-daemon:check .

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 설치형 앱 컴파일 확인
        run: cargo check --locked -p lof-library-desktop
